
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c101b">
<title>LAYS Anime</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0c101b;
  color: white;
  font-family: -apple-system, Arial, sans-serif;
}

header {
  background: #171d2c;
  padding: 22px 18px;
  border-bottom: 1px solid #343b50;
}

.logo {
  color: #ff4757;
  font-size: 28px;
  font-weight: 900;
}

.subtitle {
  color: #aab5cc;
  font-size: 13px;
  margin-top: 7px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.card {
  background: #1b2232;
  border-radius: 16px;
  padding: 17px;
  margin-bottom: 18px;
}

.poster {
  height: 145px;
  border-radius: 12px;
  background: linear-gradient(135deg,#263b67,#101525);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

h2 {
  margin-bottom: 10px;
}

.muted {
  color: #aab5cc;
  font-size: 13px;
}

video {
  width: 100%;
  background: black;
  border-radius: 12px;
  aspect-ratio: 16/9;
}

button {
  background: #ff4757;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.episode {
  background: #283247;
  border-radius: 12px;
  padding: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

#status {
  color: #aab5cc;
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8490a9;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">▶ LAYS ANIME</div>
  <div class="subtitle">
    مكتبتك الخاصة لمشاهدة الأنمي
  </div>
</header>

<main>

<section class="card">
  <div class="poster">🎬</div>
  <h2>أنمي LAYS</h2>
  <p class="muted">عدد الحلقات: 1</p>
</section>

<section class="card">
  <h2 id="playingTitle">مشغل الحلقات</h2>

  <video
    id="player"
    controls
    playsinline
    preload="metadata">
  </video>

  <p id="status">
    اختر الحلقة لبدء المشاهدة.
  </p>
</section>

<section class="card">
  <h2>الحلقات</h2>

  <div class="episode">
    <div>
      <strong>الحلقة 1</strong>
      <p class="muted">أنمي LAYS</p>
    </div>

    <button onclick="playEpisode()">
      ▶ مشاهدة
    </button>
  </div>
</section>

</main>

<footer>
  LAYS Anime — Private Streaming
</footer>

<script>
const videoUrl =
  "https://rd20.seedr.cc/ff_get/9886660/6027819743/%5BErai-raws%5D%20Marronnier%20Oukoku%20no%20Shichinin%20no%20Kishi%20-%2008%20%5B540p%20AMZN%20WEB-DL%20AVC%20EAC3%5D%5BMultiSub%5D%5BA3D6D87B%5D.mkv?st=V4lLATMDUJNFhGiregWKUQ&e=1795366250";

const player = document.getElementById("player");
const statusEl = document.getElementById("status");

function playEpisode() {
  document.getElementById("playingTitle")
    .textContent = "أنمي LAYS — الحلقة 1";

  statusEl.textContent = "جاري تحميل الفيديو...";

  player.src = videoUrl;
  player.load();

  player.play().catch(() => {
    statusEl.textContent =
      "اضغط تشغيل داخل المشغل. إذا لم يعمل، قد تكون صيغة MKV غير مدعومة.";
  });

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

player.addEventListener("playing", () => {
  statusEl.textContent = "يتم تشغيل الحلقة الآن";
});

player.addEventListener("error", () => {
  statusEl.textContent =
    "تعذر تشغيل الفيديو. قد تكون الصيغة غير مدعومة أو انتهت صلاحية الرابط.";
});
</script>

</body>
</html>
